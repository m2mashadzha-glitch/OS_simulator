<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAID — Research Centre HPC Simulator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-window">
    <div class="titlebar">
      <span>Research Centre HPC Simulator</span>
    </div>
    <nav class="menubar">
      <a href="/">Simulate</a>
      <a href="/cpu">Processes</a>
      <a href="/memory">Memory</a>
      <a href="/virtual">Virtual Memory</a>
      <a class="active" href="/raid">RAID / Disk</a>
      <a href="/metrics">Metrics</a>
    </nav>
    <div class="toolbar">
      <div class="toolbar-group">
        <label class="field">Level
          <select id="raidLevel">
            <option>RAID 0</option>
            <option>RAID 1</option>
            <option selected>RAID 5</option>
            <option>RAID 6</option>
            <option>RAID 10</option>
          </select>
        </label>
        <label class="field">Disks <input id="diskCount" type="number" min="2" value="4" style="width:3rem" /></label>
        <button class="tb-btn" id="btnApplyRaid" type="button">Apply RAID</button>
      </div>
      <div class="toolbar-group">
        <label class="field">Fail disk
          <input id="failDisk" type="number" min="1" value="2" style="width:3rem" />
        </label>
        <button class="tb-btn" id="btnFail" type="button">Disk Failure</button>
        <button class="tb-btn primary" id="btnRecover" type="button">Recover</button>
      </div>
      <div class="time-badge" id="availBadge">Data available: YES</div>
    </div>
    <div class="workspace">
      <section class="inset">
        <h3>Disk status &amp; data distribution</h3>
        <p class="raid-layout" id="layoutSummary"></p>
        <p class="raid-event" id="raidEvent"></p>
        <p class="raid-logical" id="logicalBlocks"></p>
        <div class="disk-grid" id="diskGrid"></div>
      </section>
      <section class="inset">
        <h3>RAID level comparison (university workload recommendation)</h3>
        <div id="compare"></div>
      </section>
      <div class="metrics-bar" id="raidMetrics"></div>
    </div>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/raid.js"></script>
</body>
</html>
