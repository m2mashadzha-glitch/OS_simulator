<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrics — Research Centre HPC Simulator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-window">
    <div class="titlebar">
      <span>Research Centre HPC Simulator</span>
    </div>
    <nav class="menubar">
      <a href="/">Simulate</a>
      <a href="/cpu">Processes</a>
      <a href="/memory">Memory</a>
      <a href="/virtual">Virtual Memory</a>
      <a href="/raid">RAID / Disk</a>
      <a class="active" href="/metrics">Metrics</a>
    </nav>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="tb-btn primary" id="btnStep" type="button">Step</button>
        <button class="tb-btn" id="btnRun" type="button">Run</button>
        <button class="tb-btn" id="btnStop" type="button">Reset</button>
      </div>
      <div class="time-badge" id="timeBadge">Time: 0</div>
    </div>
    <div class="workspace">
      <p class="sim-hint" id="metricsSource">Loading metrics…</p>
      <h3 class="section-title">CPU</h3>
      <div class="metrics-bar" id="cpuMetrics"></div>
      <h3 class="section-title">Memory</h3>
      <div class="metrics-bar" id="memMetrics"></div>
      <h3 class="section-title">Virtual memory</h3>
      <div class="metrics-bar" id="vmMetrics"></div>
      <h3 class="section-title">RAID</h3>
      <div class="metrics-bar" id="raidMetrics"></div>
      <section class="inset">
        <h3>Kernel / event log</h3>
        <div class="event-log" id="kernelLog"></div>
      </section>
    </div>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/metrics.js"></script>
</body>
</html>
