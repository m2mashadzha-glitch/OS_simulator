<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrics · OS Resource Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=20261007b" />
</head>
<body data-page="metrics">
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="mark">OS</div>
        <div>
          <h1>Resource Bench</h1>
          <p>SCSB082 · Limpopo</p>
        </div>
      </div>
      <nav class="rail-nav">
        <a href="/"><span class="idx">01</span>Home</a>
        <a href="/cpu"><span class="idx">02</span>CPU</a>
        <a href="/memory"><span class="idx">03</span>Memory</a>
        <a href="/virtual"><span class="idx">04</span>Virtual Mem</a>
        <a href="/raid"><span class="idx">05</span>RAID</a>
        <a class="active" href="/metrics"><span class="idx">06</span>Metrics</a>
      </nav>
      <div class="rail-clock">
        <div class="led" id="run-led"></div>
        <div><small>Sim time</small><strong id="sim-time">0</strong></div>
      </div>
    </aside>

    <div class="stage">
      <div class="stage-bar">
        <div>
          <h2>Metrics / Log</h2>
          <p>Performance meters and the step-by-step kernel log.</p>
        </div>
        <div class="dock">
          <div class="group">
            <button id="btn-step" class="btn primary">Step</button>
            <button id="btn-start" class="btn">Start</button>
            <button id="btn-pause" class="btn">Pause</button>
            <button id="btn-run20" class="btn">×20</button>
            <button id="btn-reset" class="btn warn">Reset</button>
          </div>
          <div class="group">
            <button id="btn-demo" class="btn dark">Demo</button>
          </div>
          <div class="group">
            <button id="btn-generate" class="btn ghost">P1–P5</button>
          </div>
        </div>
      </div>

      <section class="panel" style="margin-bottom:0.85rem">
        <h3><span class="num">09</span>Performance</h3>
        <div id="metrics" class="meters"></div>
      </section>
      <section class="panel">
        <h3><span class="num">10</span>Kernel log</h3>
        <pre id="log" class="kernellog"></pre>
      </section>

      <footer class="footer">
        <span>Page: Metrics</span>
        <span>Experiments evidence</span>
      </footer>
    </div>
  </div>
  <script src="/static/app.js?v=20261007b"></script>
</body>
</html>
