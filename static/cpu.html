<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Processes — Research Centre HPC Simulator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-window">
    <div class="titlebar">
      <span>Research Centre HPC Simulator</span>
    </div>

    <nav class="menubar">
      <a href="/">Simulate</a>
      <a class="active" href="/cpu">Processes</a>
      <a href="/memory">Memory</a>
      <a href="/virtual">Virtual Memory</a>
      <a href="/raid">RAID / Disk</a>
      <a href="/metrics">Metrics</a>
    </nav>

    <div class="toolbar">
      <div class="toolbar-group">
        <label class="field">
          Scheduler
          <select id="policySelect">
            <option value="FCFS">FCFS</option>
            <option value="Round Robin">Round Robin</option>
            <option value="Shortest Job First">Shortest Job First</option>
            <option value="Priority">Priority</option>
          </select>
        </label>
        <label class="field">
          Quantum
          <input id="quantumInput" type="number" min="1" value="4" style="width: 3.2rem;" />
        </label>
        <label class="field">
          Processors
          <select id="processorSelect">
            <option value="1" selected>1 CPU</option>
            <option value="2">2 CPUs</option>
            <option value="3">3 CPUs</option>
            <option value="4">4 CPUs</option>
          </select>
        </label>
        <button class="tb-btn" id="btnApplyScheduler" type="button">Apply scheduler</button>
      </div>
      <div class="time-badge" id="timeBadge">Ready to configure</div>
    </div>

    <div class="workspace">
      <div class="algo-line" id="algoLine">Scheduling policy loading…</div>

      <section class="editor-panel">
        <h3>Define research processes</h3>

        <div class="editor-actions">
          <button class="tb-btn" id="btnAddProcess" type="button">Add process</button>
          <button class="tb-btn" id="btnRemoveProcess" type="button">Remove last</button>
          <button class="tb-btn" id="btnClearEditor" type="button">Clear rows</button>
          <button class="tb-btn primary" id="btnApplyProcesses" type="button">Apply processes</button>
        </div>

        <div class="editor-table-wrap">
          <table class="editor-table">
            <thead>
              <tr>
                <th>PID</th>
                <th>Job name</th>
                <th>Arrival</th>
                <th>Burst</th>
                <th>Priority</th>
                <th>Size (KB)</th>
                <th>Memory (KB)</th>
              </tr>
            </thead>
            <tbody id="processEditorBody"></tbody>
          </table>
        </div>
        <div class="editor-msg" id="editorMsg"></div>
      </section>

      <section class="inset">
        <h3>Applied workload</h3>
        <table>
          <thead>
            <tr><th>PID</th><th>Job</th><th>Arrival</th><th>Burst</th><th>Priority</th><th>Size</th><th>Status</th></tr>
          </thead>
          <tbody id="appliedTable"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/cpu.js"></script>
</body>
</html>
