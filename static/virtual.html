<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Memory — Research Centre HPC Simulator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-window">
    <div class="titlebar">
      <span>Research Centre HPC Simulator</span>
    </div>
    <nav class="menubar">
      <a href="/">Simulate</a>
      <a href="/cpu">Processes</a>
      <a href="/memory">Memory</a>
      <a class="active" href="/virtual">Virtual Memory</a>
      <a href="/raid">RAID / Disk</a>
      <a href="/metrics">Metrics</a>
    </nav>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="tb-btn primary" id="btnStep" type="button">Step</button>
        <button class="tb-btn" id="btnRun" type="button">Run Trace</button>
        <button class="tb-btn" id="btnStop" type="button">Reset</button>
      </div>
      <div class="toolbar-group">
        <label class="field">Algorithm
          <select id="algoSelect">
            <option>FIFO</option>
            <option>LRU</option>
            <option>Optimal</option>
          </select>
        </label>
        <button class="tb-btn" id="btnApplyAlgo" type="button">Apply</button>
        <button class="tb-btn" id="btnCompare" type="button">Compare FIFO/LRU/Optimal</button>
      </div>
      <div class="time-badge" id="timeBadge">Time: 0</div>
    </div>
    <div class="workspace">
      <section class="inset">
        <h3>Page reference string</h3>
        <p id="refs" class="mono-line"></p>
        <label class="field" style="width:100%;margin-top:6px;">Edit references (comma-separated)
          <input id="refsInput" type="text" style="width:100%;min-width:20rem" />
        </label>
        <button class="tb-btn" id="btnApplyRefs" type="button" style="margin-top:6px;">Apply references</button>
      </section>
      <div class="metrics-bar" id="vmMetrics"></div>
      <section class="inset">
        <h3>Algorithm comparison</h3>
        <div id="compareTable"></div>
      </section>
      <section class="inset">
        <h3>Replacement walkthrough (selected algorithm comparison steps use same refs &amp; frame count)</h3>
        <div id="walkthrough" style="overflow:auto;max-height:280px;"></div>
      </section>
    </div>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/virtual.js"></script>
</body>
</html>
