<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Memory · OS Resource Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="virtual">
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="mark">OS</div>
        <h1>Resource Bench</h1>
        <p>SCSB082 · Limpopo</p>
      </div>
      <nav class="rail-nav">
        <a href="/"><span class="idx">01</span>Home</a>
        <a href="/cpu"><span class="idx">02</span>CPU</a>
        <a href="/memory"><span class="idx">03</span>Memory</a>
        <a class="active" href="/virtual"><span class="idx">04</span>Virtual Mem</a>
        <a href="/raid"><span class="idx">05</span>RAID</a>
        <a href="/metrics"><span class="idx">06</span>Metrics</a>
      </nav>
      <div class="rail-clock">
        <div class="led" id="run-led"></div>
        <div><small>sim time</small><strong id="sim-time">0</strong></div>
      </div>
    </aside>

    <div class="stage">
      <div class="stage-bar">
        <div>
          <h2>Virtual Memory</h2>
          <p>Hit/fault path and replacement algorithm bake-off.</p>
        </div>
        <div class="dock">
          <div class="group">
            <button id="btn-step" class="btn primary">Step</button>
            <button id="btn-start" class="btn">Start</button>
            <button id="btn-pause" class="btn">Pause</button>
            <button id="btn-run20" class="btn">×20</button>
            <button id="btn-reset" class="btn warn">Reset</button>
          </div>
          <div class="group">
            <button id="btn-demo" class="btn dark">Demo</button>
          </div>
          <div class="group">
            <label class="field">Virtual KB<input id="virtual" type="number" min="4" value="64" /></label>
            <label class="field">Replace
              <select id="replacement"><option>FIFO</option><option>LRU</option><option>Optimal</option></select>
            </label>
            <button id="btn-apply" class="btn primary">Apply</button>
          </div>
        </div>
      </div>

      <section class="panel" style="margin-bottom:0.85rem">
        <h3><span class="num">05</span>VM counters</h3>
        <div id="vm-stats" class="meters"></div>
        <div id="fault-box" class="teletype" style="margin-top:0.75rem"></div>
      </section>
      <section class="panel">
        <h3><span class="num">06</span>Replacement bake-off</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Algo</th><th>Hits</th><th>Faults</th><th>Hit%</th><th>Fault%</th></tr>
            </thead>
            <tbody id="rep-tbody"></tbody>
          </table>
        </div>
      </section>

      <footer class="footer">
        <span>Page: Virtual Memory</span>
        <span>Parts C–D</span>
      </footer>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
